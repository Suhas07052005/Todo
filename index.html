<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Mind Todo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --surface2: #1c1c1c;
  --border: #252525;
  --border2: #2e2e2e;
  --text: #e8e8e8;
  --text2: #aaa;
  --muted: #5a5a5a;
  --today: #b8f060;
  --tomorrow: #60c4f0;
  --carried: #f07060;
  --done-color: #3a3a3a;
  --done-text: #4a4a4a;
  --priority-high: #f0906a;
  --priority-med: #f0c86a;
  --priority-low: #6ab8f0;
  --radius: 12px;
  --radius-sm: 8px;
  --touch: 44px;
  --font-mono: 'DM Mono', monospace;
  --font-serif: 'Instrument Serif', serif;
  --progress-bg: #1e1e1e;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  min-height: 100dvh;
  padding: 20px 16px 100px;
  max-width: 640px;
  margin: 0 auto;
}
:focus-visible { outline: 2px solid var(--today); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ── SYNC STATUS ── */
.sync-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 16px;
  letter-spacing: 0.04em;
}
.sync-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: background 0.3s;
}
.sync-dot.synced { background: var(--today); box-shadow: 0 0 6px var(--today); }
.sync-dot.syncing { background: var(--tomorrow); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--carried); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── HEADER ── */
.header {
  margin-bottom: 20px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.header-left { flex: 1; min-width: 0; }
.title {
  font-family: var(--font-serif);
  font-size: 28px;
  font-style: italic;
  color: var(--text);
  line-height: 1.1;
}
.clock {
  color: var(--text2);
  font-size: 12px;
  margin-top: 5px;
  letter-spacing: 0.06em;
}
.header-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  margin-top: 4px;
}
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
  touch-action: manipulation;
}
.icon-btn:active { transform: scale(0.92); background: var(--surface2); }

/* ── PROGRESS BAR ── */
.progress-wrap {
  background: var(--progress-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 18px;
}
.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.progress-label { font-size: 11px; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; }
.progress-nums { font-size: 13px; font-weight: 500; color: var(--text); }
.progress-bar-bg { height: 6px; background: var(--border2); border-radius: 99px; overflow: hidden; }
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--today), #d4f590);
  border-radius: 99px;
  transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ── DAY BANNER ── */
.day-banner {
  background: rgba(184,240,96,0.07);
  border: 1px solid rgba(184,240,96,0.18);
  border-radius: var(--radius);
  padding: 12px 16px;
  color: var(--today);
  font-size: 12px;
  margin-bottom: 16px;
  display: none;
  letter-spacing: 0.03em;
  line-height: 1.6;
  position: relative;
}
/* #22: dismiss button */
.day-banner-close {
  position: absolute; top: 10px; right: 12px;
  background: none; border: none; color: var(--today);
  cursor: pointer; font-size: 14px; padding: 2px 6px;
  opacity: 0.7; line-height: 1;
}
.day-banner-close:hover { opacity: 1; }

/* #12: filter active indicator strip */
.filter-indicator {
  font-size: 11px; color: var(--muted);
  margin-bottom: 10px; margin-top: -6px;
  letter-spacing: 0.04em;
  display: none;
}
.filter-indicator.visible { display: block; }

/* #26: undo toast — toast with action link */
.toast-action {
  display: inline-block; margin-left: 10px;
  color: var(--today); cursor: pointer;
  text-decoration: underline; font-weight: 500;
  pointer-events: auto;
}

/* ── SECTION ── */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}
.section-header {
  padding: 0 16px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: background 0.15s;
}
.section-header:active { background: var(--surface2); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-today { background: var(--today); box-shadow: 0 0 8px var(--today); }
.dot-tomorrow { background: var(--tomorrow); box-shadow: 0 0 8px var(--tomorrow); }
.dot-prev { background: var(--muted); }
.section-title {
  flex: 1;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.section-title.today-title { color: var(--today); }
.section-title.tomorrow-title { color: var(--tomorrow); }
.section-title.prev-title { color: var(--muted); }
.count-badge {
  background: var(--surface2);
  color: var(--text2);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  flex-shrink: 0;
}
.chevron { color: var(--muted); font-size: 11px; transition: transform 0.2s ease; flex-shrink: 0; }
.chevron.open { transform: rotate(90deg); }
.section-body { padding: 4px 0 0; }
.section-body.collapsed { display: none; }

/* ── TASK ── */
.task-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  animation: fadeSlide 0.18s ease;
  position: relative;
}
.task-row:first-child { border-top: none; }
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.task-check {
  width: 22px; height: 22px;
  border: 1.5px solid var(--border2);
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  background: transparent;
  touch-action: manipulation;
  min-width: 22px;
}
.task-check:active { transform: scale(0.88); }
.task-check.checked { background: var(--today); border-color: var(--today); }
.task-check.checked::after { content: '✓'; font-size: 12px; color: #0d0d0d; font-weight: 700; }
.task-content { flex: 1; min-width: 0; }
.task-text {
  line-height: 1.6;
  color: var(--text);
  word-break: break-word;
  outline: none;
  font-family: var(--font-mono);
  font-size: 14px;
  background: transparent;
  border: none;
  width: 100%;
  resize: none;
  cursor: text;
  display: block;
  caret-color: var(--today);
  white-space: pre-wrap; /* allow wrap but no deliberate newlines */
  overflow-wrap: break-word;
}
.task-text.done { color: var(--done-text); text-decoration: line-through; }
.task-text.carried { color: var(--carried); }
.task-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.badge { font-size: 10px; border-radius: 4px; padding: 2px 6px; letter-spacing: 0.04em; font-weight: 500; }
.badge-carried { background: rgba(240,112,96,0.12); color: var(--carried); border: 1px solid rgba(240,112,96,0.25); }
.badge-p1 { background: rgba(240,144,106,0.12); color: var(--priority-high); border: 1px solid rgba(240,144,106,0.25); }
.badge-p2 { background: rgba(240,200,106,0.12); color: var(--priority-med); border: 1px solid rgba(240,200,106,0.25); }
.badge-p3 { background: rgba(106,184,240,0.12); color: var(--priority-low); border: 1px solid rgba(106,184,240,0.25); }
.task-actions { display: flex; align-items: flex-start; gap: 2px; flex-shrink: 0; margin-top: 0px; }
.task-action-btn {
  width: 32px; height: 32px;
  border: none;
  background: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  touch-action: manipulation;
}
.task-action-btn:active { background: var(--surface2); transform: scale(0.88); }
.task-action-btn.del:active { color: var(--carried); }
.task-action-btn.move:active { color: var(--tomorrow); }

/* ── ADD ROW ── */
.add-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px 14px;
  border-top: 1px solid var(--border);
}
.add-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.15s;
  min-width: 0;
}
.add-input::placeholder { color: var(--muted); }
.add-input:focus { border-color: var(--today); }
.add-input.tomorrow-inp:focus { border-color: var(--tomorrow); }
.add-btn {
  height: 40px;
  padding: 0 14px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text2);
  font-family: var(--font-mono);
  font-size: 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  touch-action: manipulation;
  flex-shrink: 0;
}
.add-btn:active { transform: scale(0.94); }
.add-btn.today-add:active { background: rgba(184,240,96,0.1); border-color: var(--today); color: var(--today); }
.add-btn.tomorrow-add:active { background: rgba(96,196,240,0.1); border-color: var(--tomorrow); color: var(--tomorrow); }

/* ── PRIORITY PICKER ── */
.priority-row {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  border-top: 1px solid var(--border);
}
.prio-btn {
  flex: 1;
  height: 32px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: transparent;
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--muted);
  touch-action: manipulation;
}
.prio-btn.active-p1 { background: rgba(240,144,106,0.18); border: 2px solid var(--priority-high); color: var(--priority-high); font-weight: 500; }
.prio-btn.active-p2 { background: rgba(240,200,106,0.18); border: 2px solid var(--priority-med); color: var(--priority-med); font-weight: 500; }
.prio-btn.active-p3 { background: rgba(106,184,240,0.18); border: 2px solid var(--priority-low); color: var(--priority-low); font-weight: 500; }
.prio-btn.active-none { background: var(--surface2); border: 2px solid var(--border2); color: var(--text2); font-weight: 500; }

/* ── EMPTY STATE ── */
.empty-state { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 12px; }
.empty-icon { font-size: 24px; margin-bottom: 8px; opacity: 0.5; }

/* ── SEARCH BAR ── */
.search-wrap { margin-bottom: 14px; display: none; }
.search-wrap.visible { display: block; }
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  padding: 11px 14px;
  outline: none;
}
.search-input:focus { border-color: var(--today); }
.search-input::placeholder { color: var(--muted); }

/* ── FILTER BAR ── */
.filter-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  height: 30px;
  padding: 0 12px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-family: var(--font-mono);
  font-size: 11px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s;
  touch-action: manipulation;
  flex-shrink: 0;
}
.filter-chip.active { background: var(--today); color: #0d0d0d; border-color: var(--today); font-weight: 500; }
.filter-chip:active { transform: scale(0.93); }

/* ── MODAL ── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 20px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  animation: slideUp 0.22s ease;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-title { font-size: 13px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 16px; }
.modal-row { display: flex; gap: 10px; margin-bottom: 10px; }
.modal-btn {
  flex: 1;
  height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text2);
  font-family: var(--font-mono);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  touch-action: manipulation;
}
.modal-btn.danger { color: var(--carried); border-color: rgba(240,112,96,0.3); }
.modal-btn:active { transform: scale(0.95); }

/* ── DEVICE ID / USER SETUP ── */
.setup-modal {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  gap: 20px;
}
.setup-modal.hidden { display: none; }
.setup-title { font-family: var(--font-serif); font-size: 26px; font-style: italic; color: var(--text); text-align: center; }
.setup-sub { font-size: 12px; color: var(--text2); text-align: center; line-height: 1.7; max-width: 300px; }
.setup-input {
  width: 100%;
  max-width: 320px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 15px;
  padding: 14px 16px;
  outline: none;
  text-align: center;
}
.setup-input:focus { border-color: var(--today); }
.setup-btn {
  width: 100%;
  max-width: 320px;
  height: 48px;
  background: var(--today);
  color: #0d0d0d;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  touch-action: manipulation;
  transition: all 0.15s;
}
.setup-btn:active { transform: scale(0.97); }
.setup-orline { color: var(--muted); font-size: 11px; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: 24px;
  right: 20px;
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--today);
  color: #0d0d0d;
  border: none;
  font-size: 26px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(184,240,96,0.3);
  transition: all 0.15s;
  touch-action: manipulation;
  z-index: 50;
  font-weight: 300;
  line-height: 1;
}
.fab:active { transform: scale(0.9); box-shadow: 0 2px 10px rgba(184,240,96,0.2); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  font-size: 12px;
  padding: 8px 18px;
  border-radius: 99px;
  opacity: 0;
  transition: all 0.2s ease;
  z-index: 200;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── STATS STRIP ── */
.stats-strip { display: flex; gap: 10px; margin-bottom: 18px; }
.stat-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 10px;
  text-align: center;
}
.stat-num { font-size: 22px; font-weight: 500; color: var(--text); font-family: var(--font-serif); font-style: italic; }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

/* ── DATE OVERRIDE BAR (test panel) ── */
.date-override-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: rgba(240,200,106,0.07);
  border: 1px solid rgba(240,200,106,0.22);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  margin-bottom: 16px;
}
.date-override-label {
  font-size: 11px;
  color: var(--priority-med);
  letter-spacing: 0.05em;
  flex-shrink: 0;
}
.date-override-input {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 5px 8px;
  outline: none;
  flex: 1;
  min-width: 130px;
  color-scheme: dark;
}
.date-override-input:focus { border-color: var(--priority-med); }
.date-override-btn {
  height: 30px;
  padding: 0 12px;
  border-radius: 6px;
  border: 1px solid rgba(240,200,106,0.3);
  background: transparent;
  color: var(--priority-med);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.date-override-btn.reset { color: var(--muted); border-color: var(--border2); }
.date-override-btn:active { transform: scale(0.93); }
.date-override-status {
  font-size: 11px;
  color: var(--priority-med);
  flex-shrink: 0;
}
.date-override-active .date-override-bar {
  background: rgba(240,200,106,0.13);
  border-color: rgba(240,200,106,0.4);
}
</style>
</head>
<body>

<!-- MAIN APP -->
<div id="app">

<!-- DATE OVERRIDE (TEST PANEL) -->
<div class="date-override-bar" id="date-override-bar">
  <span class="date-override-label">🧪 Test date</span>
  <input type="date" id="date-override-input" class="date-override-input" title="Override today's date for testing"/>
  <button class="date-override-btn" onclick="applyDateOverride()" title="Apply">Apply</button>
  <button class="date-override-btn reset" onclick="resetDateOverride()" title="Reset to real today">Reset</button>
  <span id="date-override-status" class="date-override-status"></span>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="title">🧠 Mind</div>
    <div class="clock" id="clock-display"></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleSearch()" title="Search" aria-label="Search tasks">🔍</button>
    <button class="icon-btn" onclick="openSettings()" title="Settings" aria-label="Open settings">⚙️</button>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap" id="search-wrap">
  <input class="search-input" id="search-input" placeholder="Search tasks…" oninput="onSearchInput()" autocomplete="off"/>
</div>

<!-- FILTER CHIPS -->
<div class="filter-bar">
  <button class="filter-chip active" onclick="setFilter('all',this)">All</button>
  <button class="filter-chip" onclick="setFilter('active',this)">Active</button>
  <button class="filter-chip" onclick="setFilter('done',this)">Done</button>
  <button class="filter-chip" onclick="setFilter('carried',this)">Carried</button>
  <button class="filter-chip" onclick="setFilter('p1',this)">🔴 High</button>
  <button class="filter-chip" onclick="setFilter('p2',this)">🟡 Med</button>

      <button class="modal-btn" onclick="closeSettings()">Close</button>

<script>
// ── LOCAL STORAGE ONLY (Firebase removed for testing) ──
const LS_KEY = 'mind_todo_local_data';

// ── GLOBALS ──
let localData = {};
let currentFilter = 'all';
let pendingPriority = { today: null, tomorrow: null };
// Date override for testing — null means use real Date
let _dateOverride = null;
// rollover guard
let rolloverDone = false;

// ── UTILS ──
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
// Returns the "effective today" — real date or override
function effectiveNow() { return _dateOverride ? new Date(_dateOverride + 'T12:00:00') : new Date(); }
function getDateKey(d) { return d.toISOString().split('T')[0]; }
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'short' });
}
function showToast(msg, duration = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}
// ── SAVE / LOAD (localStorage) ──
function saveData() {
  localStorage.setItem(LS_KEY, JSON.stringify(localData));
}
function loadData() {
  const raw = localStorage.getItem(LS_KEY);
  return raw ? JSON.parse(raw) : null;
}

// ── INIT ──
function initApp() {
  const saved = loadData();
  localData = saved || buildDefaultData();
  document.getElementById('app').style.display = 'block';
  rolloverDone = false;
  runDayRollover();
  renderAll();
  updateClock();
  setInterval(updateClock, 30000);
}

// ── USER SETUP ──
// Kept as stubs — username flow removed, no-op
window.startWithUsername = function() { initApp(); };
window.switchUser = function() { closeSettings(); };

function buildDefaultData() {
  const now = effectiveNow();
  const todayKey = getDateKey(now);
  const tomorrowKey = getDateKey(new Date(now.getTime() + 86400000));
  return {
    days: {
      [todayKey]: { tasks: [] },
      [tomorrowKey]: { tasks: [] }
    },
    streak: 0,
    lastSeenDay: todayKey,
    lastTomorrowKey: tomorrowKey,
    lastCompletedDay: null,
    initialized: true,
    dayChanged: false
  };
}

// (saveData is defined above as localStorage version)

// ── DAY ROLLOVER ──
function runDayRollover() {
  if (rolloverDone) return; // guard: run at most once per session/override
  rolloverDone = true;

  const now = effectiveNow();
  const todayKey = getDateKey(now);
  const tomorrowKey = getDateKey(new Date(now.getTime() + 86400000));

  if (!localData.days) localData.days = {};
  if (!localData.days[todayKey]) localData.days[todayKey] = { tasks: [] };
  if (!localData.days[tomorrowKey]) localData.days[tomorrowKey] = { tasks: [] };

  const lastSeen = localData.lastSeenDay || '';

  if (lastSeen && lastSeen !== todayKey) {
    // A new day has passed — run the full rollover
    const yesterday = getDateKey(new Date(now.getTime() - 86400000));
    localData.streak = lastSeen === yesterday ? (localData.streak || 0) + 1 : 1;

    // FIX 6: deduplicate carried tasks by checking existing task texts
    const existingTexts = new Set((localData.days[todayKey].tasks || []).map(t => t.text));

    // Carry unfinished tasks from the last seen day
    const prevTasks = (localData.days[lastSeen]?.tasks || []).filter(t => !t.done);
    prevTasks.forEach(t => {
      if (!existingTexts.has(t.text)) {
        localData.days[todayKey].tasks.unshift({ ...t, id: uid(), carried: true, sourceDay: lastSeen, sourceId: t.id });
        existingTexts.add(t.text);
      }
    });

    // FIX 2: move yesterday's tomorrow → today.
    // lastTomorrowKey might equal todayKey (if exactly one day passed) — handle both cases.
    const oldTmrwKey = localData.lastTomorrowKey || '';
    // The old tomorrow tasks to move: prefer oldTmrwKey bucket, but if it IS todayKey
    // those tasks are already there (written by buildDefaultData or a previous partial rollover).
    // Only clear and move if oldTmrwKey is a different key that still has tasks.
    if (oldTmrwKey && oldTmrwKey !== todayKey && localData.days[oldTmrwKey]?.tasks?.length) {
      localData.days[oldTmrwKey].tasks.forEach(t => {
        if (!existingTexts.has(t.text)) {
          localData.days[todayKey].tasks.push({ ...t, id: uid(), carried: false });
          existingTexts.add(t.text);
        }
      });
      localData.days[oldTmrwKey] = { tasks: [] };
    }

    localData.lastSeenDay = todayKey;
    localData.lastTomorrowKey = tomorrowKey;
    // FIX 3: dayChanged is set to true here and will be cleared after the banner is shown
    localData.dayChanged = true;
    // FIX 4 + 5: saveData() is called once here; isSaving flag prevents snapshot loop
    saveData();
  } else {
    // No day change — just keep lastSeenDay and lastTomorrowKey current
    // FIX 5: save these even in the else branch so next load sees the right values
    const needsSave = (localData.lastSeenDay !== todayKey) || (localData.lastTomorrowKey !== tomorrowKey);
    localData.lastSeenDay = todayKey;
    localData.lastTomorrowKey = tomorrowKey;
    if (needsSave) saveData();
  }
}

// ── RENDER ──
window.renderAll = function() {
  // #15: remember focused element to restore after re-render
  const focusedId = document.activeElement?.dataset?.taskId;

  const now = effectiveNow();
  const todayKey = getDateKey(now);
  const tomorrowKey = getDateKey(new Date(now.getTime() + 86400000));
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();

  document.getElementById('today-heading').textContent = '☀️ ' + formatDate(todayKey);
  document.getElementById('tomorrow-heading').textContent = '🌙 ' + formatDate(tomorrowKey);

  if (localData.dayChanged) {
    document.getElementById('day-banner').style.display = 'block';
    localData.dayChanged = false;
    saveData();
  } else {
    // don't hide if already visible (user may not have dismissed yet)
    if (document.getElementById('day-banner').style.display !== 'block')
      document.getElementById('day-banner').style.display = 'none';
  }

  // #12: filter indicator
  const filterIndicator = document.getElementById('filter-indicator');
  if (currentFilter !== 'all' || q) {
    const parts = [];
    if (currentFilter !== 'all') parts.push('Filter: ' + currentFilter);
    if (q) parts.push('Search: "' + q + '"');
    filterIndicator.textContent = parts.join('  ·  ');
    filterIndicator.classList.add('visible');
  } else {
    filterIndicator.classList.remove('visible');
  }

  const todayTasks = filterTasks(localData.days?.[todayKey]?.tasks || [], q);
  const tmrwTasks = filterTasks(localData.days?.[tomorrowKey]?.tasks || [], q);

  renderSection('today', todayTasks, todayKey, localData.days?.[todayKey]?.tasks || []);
  renderSection('tomorrow', tmrwTasks, tomorrowKey, localData.days?.[tomorrowKey]?.tasks || []);
  renderPrevDays(todayKey, tomorrowKey, q);
  updateStats(todayKey);
  updateProgress(localData.days?.[todayKey]?.tasks || []);

  // #15: restore focus
  if (focusedId) {
    const el = document.querySelector(`[data-task-id="${focusedId}"]`);
    if (el) { el.focus(); placeCursorAtEnd(el); }
  }
};

function filterTasks(tasks, q) {
  return tasks.filter(t => {
    const matchQ = !q || t.text.toLowerCase().includes(q);
    const matchF = currentFilter === 'all' ||
      (currentFilter === 'active' && !t.done) ||
      (currentFilter === 'done' && t.done) ||
      (currentFilter === 'carried' && t.carried && !t.done) ||
      (currentFilter === t.priority);
    return matchQ && matchF;
  });
}

function updateStats(todayKey) {
  const tasks = localData.days?.[todayKey]?.tasks || [];
  document.getElementById('stat-done').textContent = tasks.filter(t => t.done).length;
  document.getElementById('stat-left').textContent = tasks.filter(t => !t.done).length;
  document.getElementById('stat-streak').textContent = localData.streak || 0;
}

function updateProgress(tasks) {
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + total;
}

// #15: helper to restore cursor to end of contenteditable
function placeCursorAtEnd(el) {
  try {
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  } catch(e) {}
}

function renderSection(section, tasks, dayKey, allTasksForDay) {
  const container = document.getElementById(section + '-tasks');
  container.innerHTML = '';

  if (!tasks.length) {
    // #13: distinguish "no tasks at all" vs "filter matches nothing"
    const hasAnyTasks = (allTasksForDay || []).length > 0;
    const isFiltered = currentFilter !== 'all' || (document.getElementById('search-input')?.value || '').trim();
    const msg = (hasAnyTasks && isFiltered) ? 'no matches for current filter' : 'no tasks yet';
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">✦</div>${msg}</div>`;
  }

  const sorted = [...tasks].sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const po = { p1:0, p2:1, p3:2 };
    return (po[a.priority] ?? 3) - (po[b.priority] ?? 3);
  });

  const _rNow = effectiveNow();
  const todayKey = getDateKey(_rNow);
  const tomorrowKey = getDateKey(new Date(_rNow.getTime() + 86400000));

  sorted.forEach(task => {
    const row = document.createElement('div');
    row.className = 'task-row';

    // #35: use button for accessibility
    const check = document.createElement('button');
    check.className = 'task-check' + (task.done ? ' checked' : '');
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', task.done ? 'true' : 'false');
    check.setAttribute('aria-label', (task.done ? 'Uncheck' : 'Check') + ' task: ' + task.text);
    check.onclick = () => toggleDone(dayKey, task.id);

    const content = document.createElement('div');
    content.className = 'task-content';

    const textEl = document.createElement('div');
    textEl.className = 'task-text' + (task.done ? ' done' : '') + (task.carried && !task.done ? ' carried' : '');
    textEl.contentEditable = true;
    textEl.spellcheck = false;
    textEl.textContent = task.text;
    textEl.dataset.taskId = task.id; // #15: for focus restoration
    textEl.onblur = () => {
      const v = textEl.textContent.replace(/\n/g, ' ').trim();
      if (v) updateTaskText(dayKey, task.id, v);
      else { textEl.textContent = task.text; } // #3: revert instead of silent no-op
    };
    textEl.oninput = () => {
      const v = textEl.textContent;
      if (v.trim()) updateTaskText(dayKey, task.id, v);
    };
    textEl.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); } // #4: block Enter
    };
    // #4: strip newlines on paste
    textEl.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\n/g, ' ');
      document.execCommand('insertText', false, text);
    });
    content.appendChild(textEl);

    const meta = document.createElement('div');
    meta.className = 'task-meta';
    if (task.carried && !task.done) {
      const b = document.createElement('span');
      b.className = 'badge badge-carried'; b.textContent = '↩ carried';
      meta.appendChild(b);
    }
    if (task.priority && !task.done) {
      const b = document.createElement('span');
      b.className = 'badge badge-' + task.priority;
      b.textContent = task.priority === 'p1' ? '● high' : task.priority === 'p2' ? '● med' : '● low';
      meta.appendChild(b);
    }
    if (meta.children.length) content.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'task-actions';

    if (dayKey === todayKey) {
      const mv = document.createElement('button');
      mv.className = 'task-action-btn move';
      mv.title = 'Move to tomorrow';
      mv.textContent = '→';
      mv.onclick = () => moveTask(todayKey, tomorrowKey, task.id);
      actions.appendChild(mv);
    } else if (dayKey === tomorrowKey) {
      const mv = document.createElement('button');
      mv.className = 'task-action-btn move';
      mv.title = 'Move to today';
      mv.textContent = '←';
      mv.onclick = () => moveTask(tomorrowKey, todayKey, task.id);
      actions.appendChild(mv);
    }

    const del = document.createElement('button');
    del.className = 'task-action-btn del';
    del.title = 'Delete';
    del.textContent = '×';
    del.onclick = () => deleteTask(dayKey, task.id);
    actions.appendChild(del);

    row.appendChild(check);
    row.appendChild(content);
    row.appendChild(actions);
    container.appendChild(row);
  });

  const allTasks = localData.days?.[dayKey]?.tasks || [];
  const done = allTasks.filter(t => t.done).length;
  document.getElementById(section + '-count').textContent = done + '/' + allTasks.length;
}

function renderPrevDays(todayKey, tomorrowKey, q) {
  const container = document.getElementById('prev-sections');
  container.innerHTML = '';
  const skip = [todayKey, tomorrowKey];
  const keys = Object.keys(localData.days || {}).filter(k => !skip.includes(k)).sort().reverse();

  keys.forEach(key => {
    const tasks = (localData.days[key]?.tasks || []).filter(t => !q || t.text.toLowerCase().includes(q));
    if (!tasks.length) return;

    const sec = document.createElement('div');
    sec.className = 'section';

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    const secId = 'prev-' + key;
    hdr.onclick = () => {
      const body = document.getElementById(secId);
      const icon = hdr.querySelector('.chevron');
      body.classList.toggle('collapsed');
      icon.classList.toggle('open');
    };

    const dot = document.createElement('div'); dot.className = 'dot dot-prev';
    const title = document.createElement('div'); title.className = 'section-title prev-title';
    const done = tasks.filter(t => t.done).length;
    const allDone = done === tasks.length && tasks.length > 0;
    title.textContent = (allDone ? '✅' : '📋') + ' ' + formatDate(key);
    const badge = document.createElement('span'); badge.className = 'count-badge';
    badge.textContent = done + '/' + tasks.length;
    const icon = document.createElement('span'); icon.className = 'chevron'; icon.textContent = '▶';

    hdr.appendChild(dot); hdr.appendChild(title); hdr.appendChild(badge); hdr.appendChild(icon);

    const body = document.createElement('div');
    body.className = 'section-body collapsed';
    body.id = secId;

    tasks.forEach(task => {
      const row = document.createElement('div'); row.className = 'task-row';
      const check = document.createElement('div');
      check.className = 'task-check' + (task.done ? ' checked' : '');
      check.onclick = () => toggleDone(key, task.id);
      const text = document.createElement('div');
      text.className = 'task-text' + (task.done ? ' done' : '');
      text.contentEditable = true;
      text.spellcheck = false;
      text.textContent = task.text;
      text.onblur = () => { const v = text.textContent.trim(); if (v) updateTaskText(key, task.id, v); else text.textContent = task.text; };
      text.oninput = () => { if (text.textContent.trim()) updateTaskText(key, task.id, text.textContent); };
      text.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); text.blur(); } };
      const del = document.createElement('button');
      del.className = 'task-action-btn del';
      del.title = 'Delete'; del.textContent = '×';
      del.onclick = () => deleteTask(key, task.id);
      row.appendChild(check); row.appendChild(text); row.appendChild(del);
      body.appendChild(row);
    });

    sec.appendChild(hdr); sec.appendChild(body);
    container.appendChild(sec);
  });
}

// ── ACTIONS ──
window.toggleSection = function(name) {
  const body = document.getElementById(name + '-body');
  const icon = document.getElementById('chevron-' + name);
  body.classList.toggle('collapsed');
  icon.classList.toggle('open');
};

window.addTask = function(section) {
  const now = effectiveNow();
  const todayKey = getDateKey(now);
  const tomorrowKey = getDateKey(new Date(now.getTime() + 86400000));
  const key = section === 'today' ? todayKey : tomorrowKey;
  const input = document.getElementById(section + '-input');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  const priority = pendingPriority[section] || null;
  if (!localData.days) localData.days = {};
  if (!localData.days[key]) localData.days[key] = { tasks: [] };
  localData.days[key].tasks.push({ id: uid(), text, done: false, carried: false, priority });
  saveData();
  input.value = '';
  pendingPriority[section] = null;
  document.querySelectorAll(`#${section}-priority-row .prio-btn`).forEach(b => b.className = 'prio-btn');
  renderAll();
  showToast('Task added ✓');
};

window.handleKey = function(e, section) {
  if (e.key === 'Enter') { e.preventDefault(); addTask(section); }
};

function toggleDone(dayKey, taskId) {
  const tasks = localData.days?.[dayKey]?.tasks || [];
  const t = tasks.find(t => t.id === taskId);
  if (t) {
    t.done = !t.done;
    // Follow the full carry chain and sync done state to every ancestor
    let cur = t;
    while (cur.carried && cur.sourceDay && cur.sourceId) {
      const srcTasks = localData.days?.[cur.sourceDay]?.tasks || [];
      const src = srcTasks.find(s => s.id === cur.sourceId);
      if (!src) break;
      src.done = t.done;
      cur = src; // follow chain upward
    }
  }
  saveData();
  renderAll();
  if (t?.done) showToast('Done! ✓');
}

// #26: undo delete support
let _undoStack = null; // { dayKey, task, index }
let _undoTimer = null;

function deleteTask(dayKey, taskId) {
  const tasks = localData.days?.[dayKey]?.tasks || [];
  const idx = tasks.findIndex(t => t.id === taskId);
  const task = tasks[idx];
  // Follow the full carry chain and delete every ancestor
  let cur = task;
  let ancestorSnapshots = [];
  while (cur?.carried && cur.sourceDay && cur.sourceId) {
    const srcDay = localData.days?.[cur.sourceDay];
    const src = srcDay?.tasks?.find(s => s.id === cur.sourceId);
    if (srcDay) {
      const srcIdx = srcDay.tasks.findIndex(s => s.id === cur.sourceId);
      ancestorSnapshots.push({ dayKey: cur.sourceDay, task: { ...src }, index: srcIdx });
      srcDay.tasks = srcDay.tasks.filter(t => t.id !== cur.sourceId);
    }
    cur = src;
  }
  if (localData.days?.[dayKey]) {
    localData.days[dayKey].tasks = localData.days[dayKey].tasks.filter(t => t.id !== taskId);
  }
  // Save undo state
  _undoStack = { dayKey, task: { ...task }, index: idx, ancestors: ancestorSnapshots };
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => { _undoStack = null; }, 5000);
  saveData();
  renderAll();
  showToastWithUndo('Task removed');
}

function showToastWithUndo(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg + ' <span class="toast-action" onclick="undoDelete()">Undo</span>';
  t.classList.add('show');
  t.style.pointerEvents = 'auto';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.classList.remove('show'); t.style.pointerEvents = 'none'; }, 5000);
}

window.undoDelete = function() {
  if (!_undoStack) return;
  const { dayKey, task, index, ancestors } = _undoStack;
  _undoStack = null;
  clearTimeout(_undoTimer);
  if (!localData.days[dayKey]) localData.days[dayKey] = { tasks: [] };
  localData.days[dayKey].tasks.splice(index, 0, task);
  // Restore ancestors in reverse order
  ancestors.reverse().forEach(({ dayKey: dk, task: t, index: i }) => {
    if (!localData.days[dk]) localData.days[dk] = { tasks: [] };
    localData.days[dk].tasks.splice(i, 0, t);
  });
  saveData(); renderAll(); showToast('Restored ✓');
};

let _textSaveTimer = null;
function updateTaskText(dayKey, taskId, newText) {
  const t = (localData.days?.[dayKey]?.tasks || []).find(t => t.id === taskId);
  if (t) {
    t.text = newText;
    // Follow the full carry chain and sync text to every ancestor
    let cur = t;
    while (cur.carried && cur.sourceDay && cur.sourceId) {
      const src = (localData.days?.[cur.sourceDay]?.tasks || []).find(s => s.id === cur.sourceId);
      if (!src) break;
      src.text = newText;
      cur = src;
    }
    clearTimeout(_textSaveTimer);
    _textSaveTimer = setTimeout(saveData, 600);
  }
}

function moveTask(fromKey, toKey, taskId) {
  const fromTasks = localData.days?.[fromKey]?.tasks || [];
  const idx = fromTasks.findIndex(t => t.id === taskId);
  if (idx === -1) return;
  const [task] = fromTasks.splice(idx, 1);
  if (!localData.days[toKey]) localData.days[toKey] = { tasks: [] };
  // Strip carried metadata — the task is now deliberately placed in the destination
  const { sourceDay, sourceId, carried, ...rest } = task;
  localData.days[toKey].tasks.push({ ...rest, carried: false }); // keep original id
  saveData();
  renderAll();
  showToast('Task moved ✓');
}

window.setPriority = function(section, val, btn) {
  pendingPriority[section] = val === 'none' ? null : val;
  const row = document.getElementById(section + '-priority-row');
  row.querySelectorAll('.prio-btn').forEach(b => b.className = 'prio-btn');
  btn.className = 'prio-btn active-' + val;
};

window.setFilter = function(val, el) {
  currentFilter = val;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderAll();
};

// #14: debounced search handler
let _searchTimer = null;
window.onSearchInput = function() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(renderAll, 150);
};

window.toggleSearch = function() {
  const wrap = document.getElementById('search-wrap');
  wrap.classList.toggle('visible');
  if (wrap.classList.contains('visible')) {
    document.getElementById('search-input').focus();
  } else {
    document.getElementById('search-input').value = '';
    renderAll();
  }
};

window.openSettings = function() { document.getElementById('settings-modal').classList.add('open'); };
window.closeSettings = function(e) {
  if (!e || e.target === document.getElementById('settings-modal'))
    document.getElementById('settings-modal').classList.remove('open');
};

// #9: Escape closes modal; #28: keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('settings-modal').classList.remove('open');
    const sw = document.getElementById('search-wrap');
    if (sw.classList.contains('visible')) toggleSearch();
  }
  // Don't fire shortcuts when typing in an input or contenteditable
  const tag = document.activeElement?.tagName;
  const ce = document.activeElement?.contentEditable === 'true';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || ce) return;
  if (e.key === '/' || e.key === 'f') { e.preventDefault(); toggleSearch(); }
  if (e.key === 'n') { e.preventDefault(); focusTodayInput(); }
});

window.clearDone = function() {
  Object.keys(localData.days || {}).forEach(k => {
    if (localData.days[k]) localData.days[k].tasks = localData.days[k].tasks.filter(t => !t.done);
  });
  saveData(); closeSettings(); renderAll(); showToast('Done tasks cleared');
};

window.clearAllDays = function() {
  const now = effectiveNow();
  const todayKey = getDateKey(now);
  const tomorrowKey = getDateKey(new Date(now.getTime() + 86400000));
  Object.keys(localData.days || {}).forEach(k => {
    if (k !== todayKey && k !== tomorrowKey) delete localData.days[k];
  });
  saveData(); closeSettings(); renderAll(); showToast('Old days cleared');
};

window.exportData = function() {
  const blob = new Blob([JSON.stringify(localData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mind-todo-backup.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000); // #17: free memory
  showToast('Exported ✓');
};

window.importDataClick = function() { document.getElementById('import-file').click(); };
window.importData = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      // #16: validate shape before overwriting
      if (!parsed || typeof parsed !== 'object' || !parsed.days || typeof parsed.days !== 'object') {
        showToast('Invalid backup — missing days data'); return;
      }
      localData = parsed;
      saveData();
      rolloverDone = false;
      runDayRollover();
      closeSettings(); renderAll(); showToast('Imported ✓');
    } catch { showToast('Invalid JSON file'); }
  };
  r.readAsText(file);
  e.target.value = ''; // reset so same file can be re-imported
};

// #22: manually dismiss the new-day banner
window.dismissBanner = function() {
  document.getElementById('day-banner').style.display = 'none';
};

window.focusTodayInput = function() {
  const body = document.getElementById('today-body');
  if (body.classList.contains('collapsed')) toggleSection('today');
  document.getElementById('today-input').focus();
  body.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

function updateClock() {
  const now = new Date(); // always real time for clock
  const effective = effectiveNow();
  const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const date = effective.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const el = document.getElementById('clock-display');
  const overrideSuffix = _dateOverride ? ' 🧪' : '';
  if (el) el.textContent = date + '  ·  ' + time + overrideSuffix;
}

// ── DATE OVERRIDE ──
window.applyDateOverride = function() {
  const val = document.getElementById('date-override-input').value;
  if (!val) { showToast('Pick a date first'); return; }
  _dateOverride = val;
  document.getElementById('date-override-status').textContent = '→ ' + val;
  document.getElementById('date-override-bar').classList.add('date-override-active');
  rolloverDone = false;
  runDayRollover();
  renderAll();
  showToast('Date set to ' + val);
};

window.resetDateOverride = function() {
  _dateOverride = null;
  document.getElementById('date-override-input').value = '';
  document.getElementById('date-override-status').textContent = '';
  document.getElementById('date-override-bar').classList.remove('date-override-active');
  rolloverDone = false;
  runDayRollover();
  renderAll();
  showToast('Back to real today');
};

// ── INIT ──
initApp();
</script>
